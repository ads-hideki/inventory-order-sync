# 在庫・発注 一元管理システムの同期（8:30〜12:30 の毎時30分・1日5回 JST）
#   データ取得元: teps-2（EC 売上・在庫管理）の Firestore。
#   8:30 は teps-2 の 8:00 全データ同期（事務所/UF在庫）の後、9:30〜12:30 は teps-2 の毎時の売上・FBA・RSL 更新の後。
#   定刻起動: ec-dashboard の VPS（さくらのVPS）の cron が workflow_dispatch で起動する（GitHub の schedule は数時間ずれるため）。
# 必要な Secrets: FIREBASE_SERVICE_ACCOUNT（在庫システムの鍵）のみ
name: daily-sync
on:
  workflow_dispatch:          # VPS の cron / 手動実行
    inputs:
      args:
        description: "追加の引数（例: --full … 9:30以降でも事務所在庫・UF在庫を取り直す / --dry-run）"
        required: false
        default: ""
concurrency:
  group: daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: install
        working-directory: sync
        run: npm ci || npm install
      - name: run sync
        working-directory: sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ARGS: ${{ github.event.inputs.args }}
        run: node sync.js $ARGS
