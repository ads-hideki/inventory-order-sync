# エスプリム（中国の代行会社）とのチャットの読み取り → 「エスプリム在庫」スプレッドシート
#   定刻起動: ec-dashboard の VPS の cron が workflow_dispatch で起動する（2〜3時間おき。docs/CHAT_SYNC.md）
#   実行ログは公開されるので、チャットの本文・品番・数量は出さない（件数だけ）
# 必要な Secrets: FIREBASE_SERVICE_ACCOUNT（daily-sync と同じ）／ CHATWORK_API_TOKEN
name: chat-sync
on:
  workflow_dispatch:
    inputs:
      args:
        description: "追加の引数（例: --dry-run）"
        required: false
        default: ""
concurrency:
  group: chat-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: install
        working-directory: sync
        run: npm ci || npm install
      - name: run chat sync
        working-directory: sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          ARGS: ${{ github.event.inputs.args }}
        run: node chat_sync.js $ARGS
